name: Build & Deploy Production Workload

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: project-e9e43bdd-fac9-4d30-bc5
  REGION: asia-south1
  GAR_REPO: prod-apps
  IMAGE_NAME: prod-web
  CLUSTER_NAME: day1-gke-cluster
  CLUSTER_ZONE: asia-south1-a

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/132326148535/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "terraform-ci@project-e9e43bdd-fac9-4d30-bc5.iam.gserviceaccount.com"

      - name: Set up Cloud SDK & GKE Auth Plugin
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet

      - name: Build & Push Immutable Docker Image
        run: |
          IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPO}/${IMAGE_NAME}:${{ github.sha }}"
          docker build -t "$IMAGE_URI" ./app
          docker push "$IMAGE_URI"
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Connect to GKE & Deploy Manifests
        run: |
          gcloud container clusters get-credentials ${CLUSTER_NAME} --zone=${CLUSTER_ZONE} --project=${PROJECT_ID}
          kubectl create namespace prod --dry-run=client -o yaml | kubectl apply -f -
          sed -i "s|IMAGE_PLACEHOLDER|${IMAGE_URI}|g" k8s/deployment.yaml
          kubectl apply -f k8s/
          kubectl rollout status deployment/prod-web -n prod --timeout=120s
          kubectl get pods,svc,hpa,pdb -n prod
